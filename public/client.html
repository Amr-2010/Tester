<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة عملاء البيان العربي</title><style>body{font-family:Tahoma,Arial;background:#edf5fc;color:#07549b;margin:0}header{background:#07549b;color:white;padding:24px;text-align:center;border-bottom:6px solid #f39b18}main{max-width:900px;margin:30px auto;padding:20px}section{background:white;border-radius:12px;padding:24px;margin-bottom:18px}input,button{padding:12px;margin:5px;border-radius:6px;border:1px solid #bbb}button{background:#07549b;color:white;cursor:pointer}a{margin:6px;color:#07549b}li{padding:12px;border-bottom:1px solid #ddd}</style><header><h1>البيان العربي للبرمجيات والسوفت وير</h1><p>Al-Bayan Al-Arabi | Client Reports Portal</p></header><main><section id="login"><h2>دخول العميل</h2><input id="username" placeholder="اسم المستخدم"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button></section><section id="panel" hidden><h2 id="client"></h2><button onclick="logout()">تسجيل الخروج</button><ul id="reports"></ul></section><p id="error" role="alert"></p></main><script>let token=sessionStorage.getItem('client_token');async function api(p,options={}){const r=await fetch('/api/'+p,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error('تعذر إتمام الطلب: '+r.status);return r.json()}async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok)throw Error('بيانات الدخول غير صحيحة');const d=await r.json();if(d.role!=='client')throw Error('هذه البوابة لحسابات العملاء فقط');token=d.token;sessionStorage.setItem('client_token',token);await load()}catch(e){document.getElementById('error').textContent=e.message}}async function load(){try{const p=await api('client/profile');const reports=await api('client/reports');document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;document.getElementById('client').textContent=p.name;const ul=document.getElementById('reports');ul.replaceChildren();for(const r of reports){const li=document.createElement('li');li.append(document.createTextNode(r.name+' — '+r.target_type+' — '));for(const fmt of ['pdf','xlsx','pptx']){const b=document.createElement('button');b.textContent=fmt.toUpperCase();b.onclick=()=>download(r.id,fmt);li.append(b)}ul.append(li)}}catch(e){logout();document.getElementById('error').textContent=e.message}}async function download(id,fmt){try{const r=await fetch('/api/client/reports/'+id+'/export/'+fmt,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Download failed');const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='AlBayan-Report-'+id+'.'+fmt;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){document.getElementById('error').textContent=e.message}}function logout(){token=null;sessionStorage.removeItem('client_token');document.getElementById('login').hidden=false;document.getElementById('panel').hidden=true}if(token)load();</script></html>
