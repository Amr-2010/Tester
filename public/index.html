<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/png" href="/icon-32.png"><link rel="apple-touch-icon" href="/icon-180.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d4f"><link rel="manifest" href="/manifest.webmanifest"><title>Advertising & Broadcast Suite</title><style>body{font-family:system-ui,Arial;background:#eef3f8;color:#18283a;margin:0}header{background:#102d4f;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1300px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 2px 9px #17345412}button{background:#1466b8;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;margin:3px}button.secondary{background:#52657b}input,select{padding:10px;border:1px solid #ccd5df;border-radius:7px;margin:5px;max-width:100%;box-sizing:border-box}nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}table{width:100%;border-collapse:collapse;min-width:650px}td,th{padding:10px;border-bottom:1px solid #e3e9f0;text-align:right}th{background:#f4f7fa}.scroll{overflow:auto}.muted{color:#607184}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#eaf3ff;border-radius:10px;padding:16px}.stat strong{font-size:25px;display:block}.error{color:#a72323}#app{display:none}#login{max-width:430px;margin:12vh auto}label{display:inline-block;margin:4px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}</style></head><body><header><b>Advertising & Broadcast Suite</b><span id="who"></span></header><section id="login" class="card"><h2>تسجيل الدخول</h2><input id="username" placeholder="اسم المستخدم" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button onclick="login()">دخول</button><p id="loginerror" class="error"></p></section><main id="app"><nav id="tabs"></nav><div id="content"></div><button class="secondary" onclick="logout()">تسجيل خروج</button></main><script src="/app.js"></script></body></html>
